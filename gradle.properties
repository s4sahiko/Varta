org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# Required — prevents IDE/build warnings about implicit AndroidX usage
android.useAndroidX=true
# Jetifier not needed: all dependencies are already native AndroidX
android.enableJetifier=false
# Non-transitive R classes speed up builds and prevent class-not-found on minified builds
android.nonTransitiveRClass=true
kotlin.code.style=official
